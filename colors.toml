# Dark Spiderman. Aether extracted the palette from the wallpaper, which gave
# warm salmon and gold but no actual red, and made `blue` a duplicate of
# `accent`. Reworked by hand around the suit: Marvel red #E62429 for the accent
# and ANSI red, a lifted version of the suit blue for ANSI blue (#1B3E94 is
# 2.2:1 on black and unreadable), warm near-blacks for the surfaces.
#
# Green and cyan have nothing to do with Spider-Man, but a terminal palette
# needs them for diffs, ls colours and syntax, so they are kept muted rather
# than dropped. Every colour here clears 3:1 on the background; most clear AA.
mode = "dark"

accent = "#E62429"
selection = "#2a0d0f"
muted = "#8a7276"

background = "#000000"
dark_background = "#000000"
darker_background = "#000000"
lighter_background = "#1a0a0b"

foreground = "#F4EEE3"
dark_foreground = "#b7b3aa"
light_foreground = "#f6f1e7"
bright_foreground = "#f7f2ea"

red = "#E62429"
yellow = "#ffc94d"
orange = "#ff7a3d"
green = "#7fb069"
cyan = "#4fb3bf"
blue = "#4A6FD4"
magenta = "#e05a7a"
brown = "#8a6259"

bright_red = "#FF3B3F"
bright_yellow = "#ffd97a"
bright_green = "#9ecb8a"
bright_cyan = "#6fd0da"
bright_blue = "#6B8BE8"
bright_magenta = "#ff7d99"
